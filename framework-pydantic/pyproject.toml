[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framework-pydantic"
version = "0.1.0"
description = "Train Travel Pydantic example for OpenAPI generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "pydantic>=2.13.4,<3.0.0",
    "uvicorn>=0.34.0",
    "pyyaml>=6.0.3",
]

[tool.setuptools]
py-modules = ["main", "generate_openapi"]
